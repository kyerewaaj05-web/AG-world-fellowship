        <h1>Sign Up</h1>
        <p style="text-align: center;"><mark>Sign up so we can keep you up to date about this website.</mark></p>
        <form name="signup" method="POST" action="/thanks.html" data-netlify="true" data-netlify-honeypot="bot-field">
            <input type="hidden" name="form-name" value="signup">
            <p hidden><label>Do not fill this in: <input name="bot-field"></label></p>
            <div class="center">
                <label for="username">USERNAME</label><br>
                <input style="border-radius: 10px;color:#ffffff;background:#000000;" id="username" name="username" type="text" placeholder="username" required><br>
                <label for="mobile">MOBILE NUMBER (Optional)</label><br>
                <input style="border-radius: 10px;color:#ffffff;background:#000000;" id="mobile" name="mobile" type="tel" placeholder="mobile number"><br>
                <label for="email">EMAIL</label><br>
                <input style="border-radius: 10px;color:#ffffff;background:#000000;" id="email" name="email" type="email" placeholder="email" required><br>
                <button class="btn" type="submit">SUBMIT YOUR ABOVE INFO</button>
            </div>
        </form>
